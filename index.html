<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仙仙精選物件</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="brand">
      <div class="logo">仙</div>
      <div>
        <h1>仙仙精選物件</h1>
        <p>買賣房屋找仙仙｜陪你找到理想的家</p>
      </div>
    </div>
    <a class="line-btn" href="https://line.me/R/ti/p/@你的LINE官方帳號ID" target="_blank">LINE 聯絡仙仙</a>
  </header>

  <main>
    <section class="intro">
      <span>本週精選 3 間</span>
      <h2>用心嚴選・優質好宅・錯過可惜</h2>
    </section>

    <section id="propertyList" class="property-list"></section>

    <section class="more-box">
      <div>
        <h3>想看更多物件？</h3>
        <p>更多精選好宅都在品牌專區</p>
      </div>
      <a href="https://你的品牌專區網址" target="_blank">前往品牌專區</a>
    </section>

    <section class="contact-box">
      <div class="avatar">仙</div>
      <div>
        <h3>還沒找到喜歡的房子？</h3>
        <p>直接找仙仙聊聊，幫你配房找到最適合的家！</p>
      </div>
      <a href="https://line.me/R/ti/p/@你的LINE官方帳號ID" target="_blank">直接找仙仙聊聊</a>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="closeModal" class="close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer>
    © 2026 仙仙精選物件 All Rights Reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
